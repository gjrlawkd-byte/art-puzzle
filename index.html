<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>명화 퍼즐</title>
<meta name="description" content="퍼블릭 도메인 명화 200점으로 즐기는 3D 직소 퍼즐. 36조각을 모두 맞추면 그림이 건네는 한마디가 나타납니다.">
<meta property="og:title" content="명화 퍼즐">
<meta property="og:description" content="명화 200점, 36조각 3D 퍼즐. 완성하면 그림이 당신에게 한마디를 건넵니다.">
<meta property="og:image" content="art/45434.jpg">
<meta name="theme-color" content="#1d1a17">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#1d1a17; --fg:#f3ece1; --muted:#b5a993; --accent:#d9a441; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:'Noto Serif KR', serif; overflow:hidden; }
  #menu { position:fixed; inset:0; overflow:auto; padding:32px 16px; }
  #menu h1 { text-align:center; font-weight:700; margin:0 0 8px; }
  #menu p.sub { text-align:center; color:var(--muted); margin:0 0 28px; }
  .credit { text-align:center; color:var(--muted); font-size:12px; margin:32px 0 8px; }
  .bar { max-width:1100px; margin:0 auto 20px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; }
  #progress { color:var(--accent); font-weight:700; }
  #filters { display:flex; gap:6px; }
  #filters button.on { border-color:var(--accent); color:var(--accent); }
  #search { font-family:inherit; background:#2a2520; color:var(--fg); border:1px solid #4a4238; border-radius:8px; padding:8px 12px; min-width:0; flex:1 1 180px; max-width:280px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:18px; max-width:1100px; margin:0 auto; }
  .card { background:#2a2520; border-radius:10px; overflow:hidden; cursor:pointer; transition:transform .2s; position:relative; }
  .card:hover { transform:translateY(-4px); }
  .card img { width:100%; height:180px; object-fit:cover; display:block; }
  .card .t { padding:10px 12px; font-size:14px; }
  .card .a { color:var(--muted); font-size:12px; margin-top:4px; }
  .card .done { position:absolute; top:8px; right:8px; background:var(--accent); color:#1d1a17; font-size:12px; padding:3px 8px; border-radius:20px; font-weight:700; }
  #game { position:fixed; inset:0; display:none; }
  #game canvas { touch-action:none; } /* 모바일에서 조각을 끌 때 화면이 스크롤되지 않게 */
  #hud { position:fixed; top:12px; left:12px; right:12px; display:none; justify-content:space-between; align-items:center; gap:8px; pointer-events:none; }
  #hud > * { pointer-events:auto; }
  button { font-family:inherit; background:#2a2520; color:var(--fg); border:1px solid #4a4238; border-radius:8px; padding:8px 14px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  #count { background:#2a2520cc; padding:8px 14px; border-radius:8px; }
  #quote { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:radial-gradient(#000c, #000e); opacity:0; transition:opacity 1.2s; padding:16px; }
  #quote .line { display:block; opacity:0; animation:rise 1s ease-out forwards; }
  #quote .m, #quote button { opacity:0; animation:rise .8s ease-out forwards; }
  @keyframes rise { from { opacity:0; transform:translateY(12px); filter:blur(4px); } to { opacity:1; transform:none; filter:none; } }
  #quote.show { opacity:1; }
  #quote .box { max-width:640px; text-align:center; }
  #quote .q { font-size:clamp(22px,4vw,34px); line-height:1.6; font-weight:700; }
  #quote .m { color:var(--muted); margin:22px 0; font-size:14px; }
  #loading { position:fixed; inset:0; display:none; align-items:center; justify-content:center; color:var(--muted); }
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="menu">
  <h1>명화 퍼즐</h1>
  <p class="sub">36조각을 모두 맞추면, 그림이 당신에게 한마디를 건넵니다.</p>
  <div class="bar">
    <span id="progress"></span>
    <span id="filters"><button data-f="all" class="on">전체</button><button data-f="todo">미완성</button><button data-f="done">완성</button></span>
    <input id="search" type="search" placeholder="작품·작가 검색">
  </div>
  <div class="grid" id="cards"></div>
  <p class="credit">작품 이미지: The Metropolitan Museum of Art Open Access (CC0) · 명언은 이 서비스를 위해 새로 쓴 글입니다.</p>
</div>
<div id="game"></div>
<div id="hud"><button id="back">← 목록</button><span id="count"></span><span><button id="mute"></button> <button id="ghost">밑그림 보기</button></span></div>
<div id="loading">그림을 불러오는 중…</div>
<div id="quote"><div class="box"><div class="q" id="qtext"></div><div class="m" id="qmeta"></div><button id="qclose">다른 그림 맞추기</button></div></div>

<script type="module">
import * as THREE from 'three';

// 이미지: The Met Open Access (CC0), art/ 폴더. 작품 정보와 명언은 data/paintings.json
let PAINTINGS = [];
let filter = 'all', query = '';
const N = 6; // 6x6 = 36조각
const imgUrl = (id) => `art/${id}.jpg`;

const store = {
  get() { try { return JSON.parse(localStorage.getItem('puzzle-done') || '[]'); } catch { return []; } },
  add(id) { try { const s = new Set(this.get()); s.add(id); localStorage.setItem('puzzle-done', JSON.stringify([...s])); } catch {} },
};

// ---------- 메뉴 ----------
const $ = (id) => document.getElementById(id);
function renderMenu() {
  const done = store.get();
  $('progress').textContent = `${done.filter(id => PAINTINGS.some(p => p.id === id)).length} / ${PAINTINGS.length} 완성`;
  const q = query.trim().toLowerCase();
  const list = PAINTINGS.filter(p =>
    (filter === 'all' || (filter === 'done') === done.includes(p.id)) &&
    (!q || [p.title, p.artist, p.titleEn, p.artistEn].some(s => (s || '').toLowerCase().includes(q))));
  $('cards').innerHTML = list.map(p => `
    <div class="card" data-id="${p.id}">
      ${done.includes(p.id) ? '<span class="done">완성</span>' : ''}
      <img src="${imgUrl(p.id)}" alt="" loading="lazy">
      <div class="t">${p.title}<div class="a">${p.artist} · ${p.date}</div></div>
    </div>`).join('') || '<p style="text-align:center;color:var(--muted)">해당하는 작품이 없습니다.</p>';
  $('cards').querySelectorAll('.card').forEach(c => c.onclick = () => startGame(PAINTINGS.find(p => p.id === +c.dataset.id)));
}
document.querySelectorAll('#filters button').forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('on', x === b));
  renderMenu();
});
$('search').oninput = e => { query = e.target.value; renderMenu(); };

// ---------- 3D ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
$('game').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1d1a17);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(2, -3, 6); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 });
scene.add(sun);
const table = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x3b2c20, roughness: 0.9 }));
table.position.z = -0.01; table.receiveShadow = true;
scene.add(table);

let pieces = [], board = null, ghost = null, placed = 0, current = null, W = 4, H = 4;

// 가장자리 하나: (x0,y0)→(x1,y1), s = +1 바깥 탭, -1 안쪽 홈, 0 직선. 시계 방향으로 그리므로 오른쪽 법선 = 바깥
// 고전 직소 탭: 잘록한 목 + 둥근 머리. [t(변 방향), n(바깥 방향)] 비율 좌표의 베지어 곡선
const TAB = [
  [[0.30, 0.00], [0.44, 0.02], [0.40, 0.10]],
  [[0.36, 0.20], [0.40, 0.28], [0.50, 0.28]],
  [[0.60, 0.28], [0.64, 0.20], [0.60, 0.10]],
  [[0.56, 0.02], [0.70, 0.00], [1.00, 0.00]],
];
function edge(path, x0, y0, x1, y1, s) {
  if (!s) { path.lineTo(x1, y1); return; }
  const dx = x1 - x0, dy = y1 - y0;
  const nx = dy, ny = -dx; // 변 길이와 같은 크기의 바깥 법선
  const P = ([t, n]) => [x0 + dx * t + nx * n * s, y0 + dy * t + ny * n * s];
  for (const seg of TAB) path.bezierCurveTo(...P(seg[0]), ...P(seg[1]), ...P(seg[2]));
}

function buildPuzzle(tex) {
  const aspect = tex.image.width / tex.image.height;
  H = 4; W = H * aspect;
  // 내부 경계마다 탭 방향 무작위 (+1: 아래/오른쪽 조각 쪽으로 튀어나옴)
  const hz = [...Array(N + 1)].map((_, r) => [...Array(N)].map(() => (r === 0 || r === N) ? 0 : (Math.random() < .5 ? 1 : -1)));
  const vt = [...Array(N)].map(() => [...Array(N + 1)].map((_, c) => (c === 0 || c === N) ? 0 : (Math.random() < .5 ? 1 : -1)));
  const front = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6 });
  const side = new THREE.MeshStandardMaterial({ color: 0xe8dcc4, roughness: 0.8 });
  const u = 1 / N;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    // 정규화 좌표 [0,1] — 앞면 UV가 그대로 이미지 좌표가 됨
    const x0 = c * u, x1 = x0 + u, yT = 1 - r * u, yB = yT - u;
    const sh = new THREE.Shape();
    sh.moveTo(x0, yT);
    edge(sh, x0, yT, x1, yT, -hz[r][c]);
    edge(sh, x1, yT, x1, yB, vt[r][c + 1]);
    edge(sh, x1, yB, x0, yB, hz[r + 1][c]);
    edge(sh, x0, yB, x0, yT, -vt[r][c]);
    const geo = new THREE.ExtrudeGeometry(sh, { depth: 0.05, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.002, bevelSegments: 2, curveSegments: 10 });
    const cx = x0 + u / 2, cy = yB + u / 2;
    geo.translate(-cx, -cy, 0);
    geo.scale(W, H, 1);
    const m = new THREE.Mesh(geo, [front, side]);
    m.castShadow = m.receiveShadow = true;
    m.userData.target = new THREE.Vector3((cx - .5) * W, (cy - .5) * H, 0);
    scene.add(m); pieces.push(m);
  }
  // 보드 바깥의 겹치지 않는 칸에 무작위로 배치
  const step = Math.max(W, H) / N * 1.45;
  const slots = [];
  for (let gx = -12; gx <= 12; gx++) for (let gy = -12; gy <= 12; gy++) {
    const x = gx * step, y = gy * step;
    if (Math.abs(x) < W / 2 + step * 0.7 && Math.abs(y) < H / 2 + step * 0.7) continue;
    slots.push([x, y]);
  }
  slots.sort((a, b) => Math.hypot(a[0], a[1] * 1.3) - Math.hypot(b[0], b[1] * 1.3));
  const pick = slots.slice(0, N * N).sort(() => Math.random() - 0.5);
  pieces.forEach((m, i) => m.position.set(pick[i][0], pick[i][1], 0.02));
  board = new THREE.Mesh(new THREE.PlaneGeometry(W + .1, H + .1), new THREE.MeshStandardMaterial({ color: 0x2a211a }));
  board.receiveShadow = true; scene.add(board);
  ghost = new THREE.Mesh(new THREE.PlaneGeometry(W, H), new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0 }));
  ghost.position.z = 0.001; scene.add(ghost);
  const d = Math.max(W, H);
  camera.position.set(0, -d * 1.1, d * 2.6);
  camera.lookAt(0, 0, 0);
}

function clearPuzzle() {
  for (const o of [...pieces, board, ghost]) if (o) { scene.remove(o); o.geometry.dispose(); }
  pieces = []; board = ghost = null; placed = 0; tweens.length = 0;
}

async function startGame(p) {
  current = p;
  $('menu').style.display = 'none'; $('loading').style.display = 'flex';
  const tex = await new THREE.TextureLoader().loadAsync(imgUrl(p.id));
  tex.colorSpace = THREE.SRGBColorSpace;
  clearPuzzle(); buildPuzzle(tex);
  $('loading').style.display = 'none';
  $('game').style.display = 'block'; $('hud').style.display = 'flex';
  updateCount(); resize();
}
function updateCount() { $('count').textContent = `${placed} / ${N * N}`; }

// ---------- 효과음 (Web Audio로 합성, 파일 없음) ----------
let actx = null, muted = false;
try { muted = localStorage.getItem('puzzle-muted') === '1'; } catch {}
function tone(freq, dur, { type = 'sine', gain = 0.2, delay = 0, slide = 0 } = {}) {
  if (muted) return;
  actx ||= new (window.AudioContext || window.webkitAudioContext)();
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.05);
}
const sfx = {
  pick: () => tone(520, 0.08, { type: 'triangle', gain: 0.08, slide: 1.3 }),
  drop: () => tone(300, 0.1, { type: 'triangle', gain: 0.06, slide: 0.7 }),
  snap: () => { const r = 1 + (Math.random() - .5) * 0.1;
    tone(180 * r, 0.12, { type: 'square', gain: 0.05, slide: 0.5 });
    tone(880 * r, 0.25, { gain: 0.12, delay: 0.02 }); },
  done: () => [523, 659, 784, 1047, 1319].forEach((f, i) => {
    tone(f, 1.6, { gain: 0.12, delay: i * 0.14 }); tone(f / 2, 1.8, { type: 'triangle', gain: 0.05, delay: i * 0.14 }); }),
};
function setMuteLabel() { $('mute').textContent = muted ? '🔇' : '🔊'; }
$('mute').onclick = () => { muted = !muted; try { localStorage.setItem('puzzle-muted', muted ? '1' : '0'); } catch {} setMuteLabel(); };
setMuteLabel();

// ---------- 연출 (간단한 트윈) ----------
const tweens = [];
const ease = t => 1 - Math.pow(1 - t, 3);
function tween(dur, fn, done) { tweens.push({ t0: performance.now(), dur, fn, done }); }
function runTweens(now) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i], k = Math.min(1, (now - tw.t0) / tw.dur);
    tw.fn(k);
    if (k === 1) { tweens.splice(i, 1); tw.done?.(); }
  }
}
function snapEffect(m) {
  // 살짝 튀었다가 내려앉으며 작은 고리 파동이 퍼짐
  tween(350, k => { m.position.z = 0.15 * (1 - ease(k)); const s = 1 + 0.08 * Math.sin(k * Math.PI); m.scale.set(s, s, 1); });
  const r = Math.min(W, H) / N;
  const ring = new THREE.Mesh(new THREE.RingGeometry(r * 0.45, r * 0.5, 40),
    new THREE.MeshBasicMaterial({ color: 0xf3d58a, transparent: true, opacity: 0.8 }));
  ring.position.set(m.position.x, m.position.y, 0.08); scene.add(ring);
  tween(500, k => { ring.scale.setScalar(1 + k * 1.2); ring.material.opacity = 0.8 * (1 - k); },
    () => { scene.remove(ring); ring.geometry.dispose(); ring.material.dispose(); });
}
function finishEffect() {
  // 카메라가 그림 정면으로 이동하고, 조각들이 차례로 물결치며 반짝임
  const from = camera.position.clone(), to = new THREE.Vector3(0, 0, Math.max(W / camera.aspect, H) * 1.35);
  tween(1600, k => { camera.position.lerpVectors(from, to, ease(k)); camera.lookAt(0, 0, 0); });
  pieces.forEach(m => {
    const d = Math.hypot(m.position.x, m.position.y);
    setTimeout(() => tween(400, k => { m.position.z = 0.12 * Math.sin(k * Math.PI); }), 300 + d * 180);
  });
  sfx.done();
}

// ---------- 드래그 ----------
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -0.15);
let drag = null;
const offset = new THREE.Vector3();
function setRay(e) {
  ptr.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  ray.setFromCamera(ptr, camera);
}
function hitPlane(e) { setRay(e); return ray.ray.intersectPlane(dragPlane, new THREE.Vector3()); }
renderer.domElement.addEventListener('pointerdown', e => {
  setRay(e);
  const hit = ray.intersectObjects(pieces.filter(p => !p.userData.locked))[0];
  if (!hit) return;
  drag = hit.object;
  const p = hitPlane(e);
  offset.set(drag.position.x - p.x, drag.position.y - p.y, 0);
  drag.position.z = 0.15;
  sfx.pick();
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = hitPlane(e);
  if (p) drag.position.set(p.x + offset.x, p.y + offset.y, 0.15);
});
renderer.domElement.addEventListener('pointerup', e => {
  if (!drag) return;
  const p = hitPlane(e);
  if (p) drag.position.set(p.x + offset.x, p.y + offset.y, 0.15);
  const t = drag.userData.target;
  if (Math.hypot(drag.position.x - t.x, drag.position.y - t.y) < Math.min(W, H) / N * 0.35) {
    drag.position.set(t.x, t.y, 0.15); drag.userData.locked = true; placed++; updateCount();
    snapEffect(drag); sfx.snap();
    if (placed === N * N) setTimeout(finish, 500);
  } else { drag.position.z = 0.03; sfx.drop(); }
  drag = null;
});

function finish() {
  store.add(current.id);
  finishEffect();
  // 그림을 잠시 감상하게 한 뒤 명언을 한 줄씩 띄움
  $('qtext').innerHTML = current.quote.split('\n').map((l, i) => `<span class="line" style="animation-delay:${0.6 + i * 1.1}s">${l}</span>`).join('');
  $('qmeta').textContent = `${current.title} — ${current.artist}, ${current.date}`;
  $('qmeta').style.animationDelay = $('qclose').style.animationDelay = `${0.6 + current.quote.split('\n').length * 1.1}s`;
  setTimeout(() => {
    $('quote').style.display = 'flex';
    requestAnimationFrame(() => $('quote').classList.add('show'));
  }, 2600);
}
function toMenu() {
  $('quote').classList.remove('show'); $('quote').style.display = 'none';
  $('game').style.display = 'none'; $('hud').style.display = 'none'; $('menu').style.display = 'block';
  renderMenu();
}
$('back').onclick = toMenu; $('qclose').onclick = toMenu;
$('ghost').onclick = () => { if (ghost) ghost.material.opacity = ghost.material.opacity ? 0 : 0.25; };

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(now => { runTweens(now); renderer.render(scene, camera); });
fetch('data/paintings.json').then(r => r.json()).then(d => { PAINTINGS = d; renderMenu(); })
  .catch(() => { $('cards').innerHTML = '<p style="text-align:center">작품 정보를 불러오지 못했습니다.</p>'; });
// 디버그용 (주소 끝에 ?debug 를 붙였을 때만): solveAll()로 전체 맞추기, debugPiece(i)로 화면 좌표 확인
if (new URLSearchParams(location.search).has('debug')) {
  window.debugPiece = (i) => {
    const toScreen = v => { const p = v.clone().project(camera); return [(p.x + 1) / 2 * innerWidth, (1 - p.y) / 2 * innerHeight]; };
    return { from: toScreen(pieces[i].position), to: toScreen(pieces[i].userData.target), placed };
  };
  window.solveAll = () => { for (const m of pieces) if (!m.userData.locked) { m.position.copy(m.userData.target); m.userData.locked = true; placed++; } updateCount(); setTimeout(finish, 300); };
}
</script>
</body>
</html>
